x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
  volumes:
    - ./backend:/app/backend
    - ./models:/app/models
  restart: unless-stopped

services:
  postgres:
    # صورة فيها TimescaleDB + PostGIS + pgvector. اتأكدي من النسخة المتاحة وقت التشغيل.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./infra/mosquitto:/mosquitto/config

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  kafka-ui:            # اختياري: يعرض الـ topics في المناقشة
    image: provectuslabs/kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8080:8080"]
    depends_on: [kafka]
    profiles: ["debug"]

  api:
    <<: *backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  mqtt_bridge:
    <<: *backend
    command: python -m backend.workers.mqtt_bridge
  sensor_worker:
    <<: *backend
    command: python -m backend.workers.sensor_worker
  vision_worker:
    <<: *backend
    command: python -m backend.workers.vision_worker
  report_worker:
    <<: *backend
    command: python -m backend.workers.report_worker
  pipeline_worker:      # instance واحد فقط (علشان الـ Fusion ما يعملش race condition)
    <<: *backend
    command: python -m backend.workers.pipeline_worker
    deploy: {replicas: 1}
  verification_worker:
    <<: *backend
    command: python -m backend.workers.verification_worker
  notifier_worker:
    <<: *backend
    command: python -m backend.workers.notifier_worker

  # web:   # React PWA - يُضاف بعد بناء web/
  #   build: ./web
  #   ports: ["5173:5173"]

volumes:
  pgdata:
  miniodata:
